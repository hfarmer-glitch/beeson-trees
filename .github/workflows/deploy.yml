name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }}","${{ secrets.SFTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; \
                set net:max-retries 3; \
                mirror -R \
                  --exclude=^\.git/ \
                  --exclude=^\.github/ \
                  --exclude=apprunner\.yaml \
                  --exclude=server\.py \
                  --exclude=serve\.json \
                  --exclude=package\.json \
                  --exclude=package-lock\.json \
                  . /; \
                quit" \
            sftp://${{ secrets.SFTP_SERVER }}
