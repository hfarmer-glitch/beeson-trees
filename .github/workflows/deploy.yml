name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass rsync

      - name: Deploy via SFTP
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='apprunner.yaml' \
            --exclude='server.py' \
            --exclude='serve.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./ ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:/
